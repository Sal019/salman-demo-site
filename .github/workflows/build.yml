# Builds BOTH outputs of this single Flutter codebase on a GitHub runner:
#   1) the website        -> artifact "web-build"   (folder build/web)
#   2) the Android app    -> artifact "android-apk" (app-release.apk, installable)
#
# Why this exists: Muse's own computer currently blocks the localhost TCP
# that Gradle's daemon needs (Muse Settings -> Permissions -> Direct network
# protocols -> other_tcp), so APK builds fail there. A GitHub runner has no
# such block, so the same code builds end-to-end in the cloud.
#
# How to use: push this project to a GitHub repo (branch "main"), then either
# push a change or open the repo's "Actions" tab and run this workflow
# manually ("Run workflow"). When it finishes, download the artifacts from
# the workflow run page.
#
# Versions match the environment verified on Muse's computer on 2026-10-18:
# Flutter 3.47.7 stable (Dart 3.13.5) and Temurin JDK 21.

name: Build web + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Regenerate any files not stored in git
        # The git-ignored Gradle wrapper and the icon images are not in the
        # repository; flutter create restores anything that is missing.
        run: flutter create --platforms=web,android --project-name salman_demo_site .

      - name: Install dependencies
        run: flutter pub get

      - name: Build the website
        run: flutter build web --release

      - name: Upload the website build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Build the Android APK
        run: flutter build apk --release

      - name: Upload the Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
